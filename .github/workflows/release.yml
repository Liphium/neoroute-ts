name: Release

on:
    push:
        branches:
            - main

permissions:
    contents: write
    pull-requests: write

jobs:
    release:
        runs-on: ubuntu-latest
        permissions:
            contents: write
            pull-requests: write
            id-token: write
        steps:
            - uses: googleapis/release-please-action@v5
              id: release
              with:
                  token: ${{ secrets.GITHUB_TOKEN }}

            # Publish to npm when release created
            - uses: actions/checkout@v4
              if: ${{ steps.release.outputs.release_created }}

            - name: Setup pnpm
              uses: pnpm/action-setup@v6.0.9
              if: ${{ steps.release.outputs.release_created }}

            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  registry-url: 'https://registry.npmjs.org'
                  cache: pnpm
              if: ${{ steps.release.outputs.release_created }}

            - run: npm ci
              if: ${{ steps.release.outputs.release_created }}

            - run: npm publish
              if: ${{ steps.release.outputs.release_created }}
